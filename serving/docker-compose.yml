# Music Vision — TensorFlow Serving
#
# Prerequisites:
#   python3 ml/prepare_serving_model.py --export-stub   # or --from-keras …
#   docker compose -f serving/docker-compose.yml up
#
# REST :8501   gRPC :8500

services:
  music-vision-tfserving:
    image: tensorflow/serving:2.14.1
    container_name: music-vision-tfserving
    ports:
      - "8500:8500"
      - "8501:8501"
    volumes:
      - ./models:/models
      - ./models.config:/etc/tfs/models.config:ro
    command:
      - --model_config_file=/etc/tfs/models.config
      - --model_config_file_poll_wait_seconds=30
      - --rest_api_port=8501
      - --port=8500
    restart: unless-stopped